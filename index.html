        function mbaImportBackup(input) {

                    const data = parsed && parsed.data ? parsed.data : parsed;
                    if (!data || !Array.isArray(data.students) || !Array.isArray(data.accounts)) throw new Error('Format backup tidak valid.');
                    if (!confirm('Impor backup akan mengganti data aplikasi pada browser ini. Lanjutkan?')) { input.value=''; return; }
                    MBA_PERSIST_KEYS.forEach(key => { if (Object.prototype.hasOwnProperty.call(data, key)) DB[key] = data[key]; });
                    mbaSaveLocalData(false); input.value='';
                    showToast('Backup berhasil diimpor. Halaman akan dimuat ulang.');
                    setTimeout(() => location.reload(), 700);
                } catch (err) {

        // Migrasi otomatis matriks lama (1, 5, 10, 20 siswa) ke kolom 0–10.
        // Hanya berjalan bila data tersimpan masih memakai format lama; data modul lain tidak disentuh.
        function migrateTuitionMatrixToZeroThroughTen() {
            const matrix = DB.tuitionMatrix;
            if (!matrix || !Array.isArray(matrix.headers) || !Array.isArray(matrix.rows)) return;
            const headerText = matrix.headers.map(h => String(h || '').trim().toLowerCase());
            const hasAllCounts = Array.from({length: 11}, (_, n) => headerText.some(h => h.match(new RegExp('^' + n + '\\s*(siswa)?$')))).every(Boolean);
            if (hasAllCounts) return;
            const oldHeaderCount = headerText.some(h => /20\s*siswa/.test(h)) && headerText.some(h => /5\s*siswa/.test(h));
            if (!oldHeaderCount) return;
            const newHeaders = ['Jenjang', ...Array.from({length: 11}, (_, n) => `${n} Siswa`)];
            const oldThresholds = matrix.headers.map((h, i) => ({i, n: (String(h).match(/\d+/) || [])[0]})).filter(x => x.i > 0 && x.n !== undefined).map(x => ({i:x.i,n:Number(x.n)})).sort((a,b)=>a.n-b.n);
            const newRows = matrix.rows.map(row => {
                const level = String(row[0] || '').trim().toUpperCase();
                const defaults = level === 'SD' ? [15000,25000,30000,35000,40000,45000,51000,57000,63000,69000,75000]
                    : level === 'SMA' ? [15000,35000,44000,53000,61000,70000,78000,86000,94000,102000,110000]
                    : [15000,30000,36000,43000,49000,55000,62000,69000,76000,83000,90000];
                const values = Array.from({length:11}, (_, count) => {
                    if (count === 0) return '15000';
                    const exact = oldThresholds.find(t => t.n === count);
                    if (exact) return String(row[exact.i] ?? defaults[count]);
                    // Pertahankan nilai anchor lama; untuk kolom baru gunakan tarif bertahap yang telah disepakati sebelumnya.
                    return String(defaults[count]);
                });
                return [row[0], ...values];
            });
            DB.tuitionMatrix = {headers:newHeaders, rows:newRows};
            mbaSaveLocalData(false);
        }
        migrateTuitionMatrixToZeroThroughTen();
        window.addEventListener('beforeunload', () => mbaSaveLocalData(false));

        // --- HELPER: TUITION FEE CALCULATOR FROM MATRIX ---
        function calculateFeeFromMatrix(level, studentCount) {
            const matrix = DB.tuitionMatrix || { headers: [], rows: [] };
            const count = Math.max(0, Number(studentCount) || 0);
            // Fee untuk 0 siswa hadir tetap mengikuti kolom 0 Siswa pada matriks.
            const headers = Array.isArray(matrix.headers) ? matrix.headers : [];
            const rows = Array.isArray(matrix.rows) ? matrix.rows : [];
            const normalizedLevel = String(level || 'SMP').trim().toUpperCase();
            const row = rows.find(r => String(r[0] || '').trim().toUpperCase() === normalizedLevel)
                || rows.find(r => String(r[0] || '').trim() !== '');
            if (!row) return 0;

            // Baca ambang jumlah siswa dari judul kolom matriks, bukan angka tetap.
            const rateColumns = headers.map((header, index) => ({
                index,
                threshold: index === 0 ? null : (String(header).match(/\d+/) ? Number(String(header).match(/\d+/)[0]) : null)
            })).filter(c => c.index > 0 && c.threshold !== null && Number.isFinite(c.threshold))
              .sort((a, b) => a.threshold - b.threshold);
            if (!rateColumns.length) return 0;
            let selected = rateColumns[0];
            rateColumns.forEach(col => { if (count >= col.threshold) selected = col; });
            const raw = row[selected.index];
            const digits = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
            return digits ? Number(digits) : 0;
        }

                        <div><h2 class="text-xl font-bold text-slate-800">Data Pendaftaran Akun & Siswa Baru</h2><p class="text-xs text-slate-500">Validasi dan kelola akun pendaftar baru.</p></div>
                        <input type="text" id="input-search-reg" placeholder="Cari nama pendaftar..." value="${searchQ}" oninput="filterPendaftaran(this.value)" class="px-4 py-2 border rounded-xl text-xs w-full md:w-64 focus:outline-none focus:border-indigo-600">
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse text-xs">

                                ${filtered.map((r, idx) => `
                                    <tr data-search="${r.fullName.toLowerCase()}${r.username.toLowerCase()}">
                                        <td class="p-4 font-bold">${r.fullName}</td>
                                        <td class="p-4 font-mono text-indigo-600">${r.username} / ••••••••</td>
                                        <td class="p-4 uppercase font-bold">${r.role} (${r.identityId})</td>
                                        <td class="p-4">${r.phone}</td>
                                        <td class="p-4"><span class="px-2 py-1 rounded-full text-[10px] font-bold ${r.status === 'Disetujui' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${r.status}</span></td>
                                        <td class="p-4 text-center space-x-1">

                                            <button onclick="DB.registrations.splice(${idx},1);renderPendaftaranTab(document.getElementById('tab-content-area'))" class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded font-semibold"><i class="fa-solid fa-trash"></i></button>

                inputEl.focus();
                inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
            }
        }

        function filterPendaftaran(val) {
            window._regSearch = val;
            const rows = document.querySelectorAll('#tbody-pendaftaran tr');
            rows.forEach(row => {
                const text = row.getAttribute('data-search') || '';
                row.style.display = text.includes(val.toLowerCase()) ? '' : 'none';
            });
        }

        function approveRegistration(idx) {
            const reg = DB.registrations[idx];
            reg.status = 'Disetujui';

            const existingAcc = DB.accounts.find(a => a.username === reg.username);
            if (!existingAcc) {
                DB.accounts.push({
                    id: DB.accounts.length + 1,
                    name: reg.fullName,
                    username: reg.username,
                    password: reg.password,
                    role: reg.role,
                    phone: reg.phone,
                    active: true,
                    profileCompleted: false
                });
            }

            if (reg.role === 'siswa') {
                DB.invoices.push({
                    invoiceNo: `INV-2026-06-00${DB.invoices.length + 1}`,
                    date: reg.date,
                    month: 'Juni 2026',
                    studentName: reg.fullName,
                    baseAmount: 350000,
                    discount: 0,
                    total: 350000,
                    deadline: '2026-06-20',
                    status: 'Belum Lunas',
                    waSent: false
                });
            }

            DB.notifications.unshift({
                id: DB.notifications.length + 1,
                text: `Pendaftaran ${reg.fullName} telah divalidasi dan disetujui.`,
                time: 'Baru saja',
                icon: 'fa-user-check',
                color: 'text-emerald-600 bg-emerald-50'
            });

            showToast(`Pendaftaran ${reg.fullName} disetujui! Akun diaktifkan.`);
            renderPendaftaranTab(document.getElementById('tab-content-area'));
        }

        function openRegModal(idx) {

                    <div><label class="font-bold block mb-1">Password</label><input type="text" id="ed-pass" placeholder="Isi password baru (wajib)" required class="w-full px-3 py-2 border rounded-xl"></div>
                    <div><label class="font-bold block mb-1">No HP</label><input type="text" id="ed-phone" value="${r.phone}" required class="w-full px-3 py-2 border rounded-xl"></div>

            DB.registrations[idx].fullName = document.getElementById('ed-name').value;
            DB.registrations[idx].username = document.getElementById('ed-user').value;
            DB.registrations[idx].password = document.getElementById('ed-pass').value;
            DB.registrations[idx].phone = document.getElementById('ed-phone').value;
            showToast('Pendaftaran diperbarui.'); closeModal(); renderAppLayout('pendaftaran');

                        <h3 class="font-bold text-slate-800 mt-1 break-words">${s.name || '-'}</h3><p class="text-xs text-slate-500 mt-1">${s.level || '-'} · ${s.grade || '-'} · ${s.school || 'Sekolah belum diisi'}</p><p class="text-[11px] text-slate-500 mt-1">Aktif sejak: ${s.activeDate || s.regDate || '-'}${String(s.active).toLowerCase()==='nonaktif' ? ` · Nonaktif sejak: ${s.nonActiveDate || '-'}` : ''}</p></div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4 text-xs">
                        <div class="rounded-xl bg-slate-50 p-3"><p class="text-slate-500">Kontak siswa</p><p class="font-semibold break-words">${s.phone || '-'}</p></div>
                        <div class="rounded-xl bg-slate-50 p-3"><p class="text-slate-500">Orang tua / wali</p><p class="font-semibold break-words">${s.fatherName || s.motherName || 'Wali siswa'} · ${s.parentPhone || '-'}</p></div>
                        ${role !== 'tentor' ? `<div class="rounded-xl bg-indigo-50 p-3 sm:col-span-2"><p class="text-indigo-500">Program / SPP pokok</p><p class="font-bold text-indigo-800">${s.program || 'Reguler'} · ${money(s.sppBase)}</p></div>` : ''}

                    <div class="flex flex-wrap gap-2 mt-3"><button onclick="viewStudentDetail(${idx})" class="min-h-10 px-3 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs"><i class="fa-solid fa-eye mr-1"></i> Detail</button>
                    ${isAdmin ? `<button onclick="openStudentModal(${idx})" class="min-h-10 px-3 rounded-xl bg-indigo-100 text-indigo-700 font-semibold text-xs"><i class="fa-solid fa-pen mr-1"></i> Edit</button><button onclick="deleteStudent(${idx})" class="min-h-10 px-3 rounded-xl bg-rose-100 text-rose-700 font-semibold text-xs"><i class="fa-solid fa-trash mr-1"></i> Hapus</button>` : ''}</div>
                </article>`;
            };

            area.innerHTML = `
                <div class="space-y-5 min-w-0">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div><h2 class="text-xl font-bold text-slate-800">Data Siswa & Orang Tua / Wali</h2><p class="text-xs text-slate-500 mt-1">Cari dan kelola biodata siswa sesuai hak akses akun Anda.</p></div>
                        ${isAdmin ? `<button onclick="openStudentModal()" class="min-h-11 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-xl font-bold text-xs shadow self-start"><i class="fa-solid fa-plus mr-1"></i> Tambah Siswa</button>` : ''}
                    </div>
                    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 sm:p-4 space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                            <label class="sm:col-span-2 lg:col-span-2"><span class="block text-xs font-bold text-slate-600 mb-1.5">Cari siswa</span><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i><input id="siswa-search" type="search" value="${(window._siswaSearch || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" oninput="window._siswaSearch=this.value; renderSiswaTab(document.getElementById('tab-content-area'))" placeholder="Nama, no. induk, sekolah, kontak..." class="w-full min-h-11 pl-9 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200"></div></label>
                            <label><span class="block text-xs font-bold text-slate-600 mb-1.5">Jenjang</span><select onchange="window._siswaLevel=this.value;renderSiswaTab(document.getElementById('tab-content-area'))" class="w-full min-h-11 px-3 py-2.5 border border-slate-200 rounded-xl text-sm"><option ${levelFilter==='Semua'?'selected':''}>Semua</option>${['TK','SD','SMP','SMA','Lainnya'].map(v=>`<option ${levelFilter===v?'selected':''}>${v}</option>`).join('')}</select></label>
                            <label><span class="block text-xs font-bold text-slate-600 mb-1.5">Status</span><select onchange="window._siswaStatus=this.value;renderSiswaTab(document.getElementById('tab-content-area'))" class="w-full min-h-11 px-3 py-2.5 border border-slate-200 rounded-xl text-sm"><option ${statusFilter==='Semua'?'selected':''}>Semua</option><option ${statusFilter==='Aktif'?'selected':''}>Aktif</option><option ${statusFilter==='Nonaktif'?'selected':''}>Nonaktif</option></select></label>
                        </div>
                        <div class="flex flex-wrap items-center justify-between gap-2 text-xs"><p class="text-slate-500">Menampilkan <strong class="text-slate-800">${filtered.length}</strong> dari <strong class="text-slate-800">${dataList.length}</strong> siswa</p><button onclick="window._siswaSearch='';window._siswaLevel='Semua';window._siswaStatus='Semua';renderSiswaTab(document.getElementById('tab-content-area'))" class="min-h-9 px-3 rounded-lg text-indigo-700 hover:bg-indigo-50 font-bold"><i class="fa-solid fa-rotate-left mr-1"></i> Reset filter</button></div>
                    </section>
                    ${filtered.length ? `<div class="grid grid-cols-1 xl:grid-cols-2 gap-3">${filtered.map(studentCard).join('')}</div>` : `<div class="bg-white border border-dashed border-slate-300 rounded-2xl p-8 text-center"><i class="fa-solid fa-user-slash text-3xl text-slate-300"></i><p class="font-bold text-slate-600 mt-3">Data siswa tidak ditemukan</p><p class="text-xs text-slate-500 mt-1">Coba ubah kata kunci atau reset filter.</p></div>`}
                </div>`;
        }

        function deleteStudent(idx) {
            if (DB.currentUser?.role !== 'admin' || !DB.students[idx]) return;
            const student = DB.students[idx];
            if (!confirm(`Hapus data siswa ${student.name}? Tindakan ini tidak dapat dibatalkan kecuali Anda memiliki cadangan data.`)) return;
            DB.students.splice(idx, 1);
            mbaSaveLocalData(false);
            renderAppLayout('siswa');
            showToast('Data siswa berhasil dihapus.');
        }

            const isEdit = idx !== null;
            const isAdmin = DB.currentUser.role === 'admin';
            const s = isEdit ? DB.students[idx] : { 
                noInduk: `MB00${DB.students.length+1}`, active: 'Aktif', activeDate: new Date().toISOString().slice(0,10), nonActiveDate: '', name: '', level: 'SMP', grade: 'Kelas 8', 
                school: '', phone: '', parentPhone: '', program: 'Reguler SMP', sppBase: 350000,

            };

            openModal(isEdit ? 'Edit Data Siswa Lengkap' : 'Tambah Data Siswa Baru', `
                <form onsubmit="saveStudent(event, ${idx})" class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="font-bold block mb-1">No. Induk ${!isAdmin ? '<span class="text-slate-400 font-normal">(Terkunci)</span>' : ''}</label>
                            <input type="text" id="m-noInduk" value="${s.noInduk}" ${!isAdmin ? 'readonly class="w-full px-3 py-2 border rounded-xl bg-slate-100 text-slate-500 cursor-not-allowed"' : 'required class="w-full px-3 py-2 border rounded-xl"'}>
                        </div>
                        <div><label class="font-bold block mb-1">Nama Lengkap</label><input type="text" id="m-name" value="${s.name}" required class="w-full px-3 py-2 border rounded-xl"></div>
                    </div>
                    <section class="rounded-xl border border-indigo-100 bg-indigo-50/60 p-3 space-y-3">
                        <p class="font-bold text-indigo-900">Status Keaktifan Siswa</p>
                        <label class="flex items-center gap-3 rounded-lg bg-white border border-slate-200 p-3 cursor-pointer">
                            <input type="checkbox" id="m-active" ${String(s.active || 'Aktif').toLowerCase()==='aktif'?'checked':''} onchange="document.getElementById('m-activeDate-wrap').classList.toggle('hidden',!this.checked);document.getElementById('m-nonActiveDate-wrap').classList.toggle('hidden',this.checked);if(this.checked){document.getElementById('m-nonActiveDate').value='';if(!document.getElementById('m-activeDate').value)document.getElementById('m-activeDate').value=new Date().toISOString().slice(0,10)}else if(!document.getElementById('m-nonActiveDate').value){document.getElementById('m-nonActiveDate').value=new Date().toISOString().slice(0,10)}" class="w-5 h-5 accent-indigo-600">
                            <span><strong class="block text-sm text-slate-800">Siswa Aktif</strong><span class="text-[11px] text-slate-500">Centang jika siswa masih mengikuti bimbingan belajar.</span></span>
                        </label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <label id="m-activeDate-wrap" class="${String(s.active || 'Aktif').toLowerCase()==='aktif'?'':'hidden'}"><span class="font-bold block mb-1">Tanggal Aktif</span><input type="date" id="m-activeDate" value="${s.activeDate || s.regDate || new Date().toISOString().slice(0,10)}" class="w-full min-h-10 px-3 py-2 border border-slate-200 rounded-xl bg-white"></label>
                            <label id="m-nonActiveDate-wrap" class="${String(s.active || 'Aktif').toLowerCase()==='aktif'?'hidden':''}"><span class="font-bold block mb-1">Tanggal Nonaktif</span><input type="date" id="m-nonActiveDate" value="${s.nonActiveDate || ''}" class="w-full min-h-10 px-3 py-2 border border-slate-200 rounded-xl bg-white"></label>
                        </div>
                    </section>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="font-bold block mb-1">Jenjang</label>
                            <select id="m-level" class="w-full px-3 py-2 border rounded-xl">
                                <option ${s.level==='TK'?'selected':''}>TK</option>
                                <option ${s.level==='SD'?'selected':''}>SD</option>
                                <option ${s.level==='SMP'?'selected':''}>SMP</option>
                                <option ${s.level==='SMA'?'selected':''}>SMA</option>
                                <option ${s.level==='Lainnya'?'selected':''}>Lainnya</option>
                            </select>
                        </div>
                        <div><label class="font-bold block mb-1">Kelas</label><input type="text" id="m-grade" value="${s.grade}" class="w-full px-3 py-2 border rounded-xl"></div>
                        <div><label class="font-bold block mb-1">Agama</label><input type="text" id="m-religion" value="${s.religion}" class="w-full px-3 py-2 border rounded-xl"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="font-bold block mb-1">Tempat Lahir</label><input type="text" id="m-pob" value="${s.pob}" class="w-full px-3 py-2 border rounded-xl"></div>

                    <div class="grid grid-cols-2 gap-2">

                        <div><label class="font-bold block mb-1">URL Foto Selfie</label><input type="text" id="m-selfie" value="${s.selfie}" class="w-full px-3 py-2 border rounded-xl"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="font-bold block mb-1">No HP Siswa</label><input type="text" id="m-phone" value="${s.phone}" class="w-full px-3 py-2 border rounded-xl"></div>

                    </div>

        function saveStudent(e, idx) {
            e.preventDefault();
            const isAdmin = DB.currentUser.role === 'admin';
            const data = {
                noInduk: isAdmin ? document.getElementById('m-noInduk').value : (idx !== null ? DB.students[idx].noInduk : `MB00${DB.students.length+1}`),
                name: document.getElementById('m-name').value,
                level: document.getElementById('m-level').value,
                grade: document.getElementById('m-grade').value,
                religion: document.getElementById('m-religion').value,
                pob: document.getElementById('m-pob').value,
                dob: document.getElementById('m-dob').value,
                school: document.getElementById('m-school').value,
                selfie: document.getElementById('m-selfie').value,
                phone: document.getElementById('m-phone').value,
                email: document.getElementById('m-email').value,
                fatherName: document.getElementById('m-father').value,
                fatherJob: document.getElementById('m-fatherJob').value,
                motherName: document.getElementById('m-mother').value,
                motherJob: document.getElementById('m-motherJob').value,
                parentPhone: document.getElementById('m-parentPhone').value,
                sppBase: Number(document.getElementById('m-spp').value),
                active: document.getElementById('m-active').checked ? 'Aktif' : 'Nonaktif',
                activeDate: document.getElementById('m-active').checked ? (document.getElementById('m-activeDate').value || new Date().toISOString().slice(0,10)) : (idx !== null ? (DB.students[idx].activeDate || DB.students[idx].regDate || '') : ''),
                nonActiveDate: document.getElementById('m-active').checked ? '' : (document.getElementById('m-nonActiveDate').value || new Date().toISOString().slice(0,10)),
                program: 'Reguler'
            };

            const duplicate = DB.students.some((student, i) => i !== idx && String(student.noInduk || '').trim().toLowerCase() === String(data.noInduk || '').trim().toLowerCase());
            if (duplicate) { showToast('Nomor induk sudah digunakan. Gunakan nomor yang berbeda.'); return; }
            if(idx !== null) DB.students[idx] = { ...DB.students[idx], ...data };
            else DB.students.push({ id: DB.students.length ? Math.max(...DB.students.map(x => Number(x.id) || 0)) + 1 : 1, ...data });

        function filterScheduleStudents() {
            const q = (document.getElementById('sch-student-search')?.value || '').trim().toLowerCase();

                label.classList.toggle('hidden', !label.dataset.studentLabel.includes(q));
            });
        }

        function updateScheduleStudentCount() {
            const count = document.querySelectorAll('input[name="rombel-student"]:checked').length;
            const el = document.getElementById('sch-student-count');
            if (el) el.textContent = `${count} dipilih`;
        }

        function saveSchedule(e, idx) {
            e.preventDefault();
            const name = document.getElementById('sch-name').value;
            const level = document.getElementById('sch-level').value;
            const day = document.getElementById('sch-day').value;
            const time = document.getElementById('sch-time').value;
            const room = document.getElementById('sch-room').value;
            const checkedStudents = Array.from(document.querySelectorAll('input[name="rombel-student"]:checked')).map(el => el.value);
            const tutorCode = document.getElementById('sch-tutor')?.value || '';
            const selectedTutor = (DB.tutors || []).find(t => String(t.code) === String(tutorCode));
            if (!selectedTutor) { showToast('Pilih tentor pengampu yang valid.', 'error'); return; }
            const normalizedTime = time.trim().replace(/\s+/g, ' ').toLowerCase();
            const conflict = DB.schedules.some((other, i) => i !== idx && other.day === day && String(other.time || '').trim().replace(/\s+/g, ' ').toLowerCase() === normalizedTime && (
                (String(other.tutorCode || '') === String(selectedTutor.code)) ||
                (String(other.room || '').trim().toLowerCase() === room.trim().toLowerCase() && room.trim() !== '')
            ));
            if (conflict) {
                showToast('Bentrok jadwal: tentor atau ruangan sudah digunakan pada hari dan jam yang sama.', 'error');
                return;
            }
            const existingTutorCode = selectedTutor.code;
            const existingTutorName = selectedTutor.name;

            const scheduleData = {
                id: idx !== null ? DB.schedules[idx].id : `SCH-${Date.now()}`,
                name: name,
                level: level,
                day: day,
                time: time,
                room: room,
                tutorCode: existingTutorCode,
                tutorName: existingTutorName,
                students: checkedStudents
            };

            if(idx !== null) {
                DB.schedules[idx] = scheduleData;
            } else {
                DB.schedules.push(scheduleData);
            }

            DB.notifications.unshift({
                id: DB.notifications.length + 1,
                text: `Jadwal baru "${name}" (${room}) telah ditambahkan.`,
                time: 'Baru saja',
                icon: 'fa-calendar-days',
                color: 'text-indigo-600 bg-indigo-50'
            });

            mbaSaveLocalData(false); closeModal(); renderAppLayout('jadwal'); showToast('Jadwal Les & Rombel berhasil disimpan.');
        }

        function renderAbsensiSiswaTab(area) {
            const role = DB.currentUser.role;

            let attList = DB.studentAttendance;
            const reportPeriod = window._studentReportPeriod || 'month';
            const now = new Date();
            const reportYear = now.getFullYear();
            const reportMonth = String(now.getMonth()+1).padStart(2,'0');

            if (role === 'tentor') {
                const tentor = getCurrentTentor();
                const tentorScheduleIds = DB.schedules.filter(s => s.tutorCode === tentor?.code || s.tutorName === tentor?.name).map(s => s.id);
                attList = DB.studentAttendance.filter(a => tentorScheduleIds.includes(a.scheduleId) || a.tutor === tentor?.name);
            } else if (role === 'ortu' || role === 'siswa') {
                const names = getCurrentUserStudentNames();
                attList = DB.studentAttendance.filter(a => names.some(n => n.toLowerCase() === a.studentName.toLowerCase()));
            }

            if (role === 'tentor') {
                // Tampilan tentor dibatasi pada seluruh absensi siswa untuk tanggal hari ini.
                const today = `${reportYear}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
                attList = attList.filter(a => String(a.date || '').slice(0, 10) === today);
            } else {
                // Perilaku laporan admin dan akun lain tetap seperti sebelumnya.
                attList = attList.filter(a => { const d = String(a.date || ''); return reportPeriod === 'all' || (reportPeriod === 'year' ? d.startsWith(String(reportYear)) : d.startsWith(`${reportYear}-${reportMonth}`)); });
            }
            const presentByStudent = {};
            attList.forEach(a => { const key = a.studentName || 'Siswa'; if (!presentByStudent[key]) presentByStudent[key] = { hadir: 0, total: 0, items: [] }; presentByStudent[key].total++; if (a.status === 'Hadir') presentByStudent[key].hadir++; presentByStudent[key].items.push(a); });
            const periodLabel = reportPeriod === 'year' ? `Tahun ${reportYear}` : reportPeriod === 'all' ? 'Semua periode' : `Bulan ${(reportPeriod === 'custom' ? selectedMonth : `${reportYear}-${reportMonth}`)}`;

            // Grouping Logic berdasarkan Tanggal | Jadwal & Rombel | Tentor
            const groups = [];
            attList.forEach(item => {
                const key = `${item.date}_${item.scheduleName}_${item.tutor}`;
                let group = groups.find(g => g.key === key);

                    group = {
                        key: key,
                        date: item.date,
                        scheduleName: item.scheduleName,
                        tutor: item.tutor,
                        subject: item.subject,
                        material: item.material,
                        items: []

            area.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div><h2 class="text-xl font-bold text-slate-800">Absensi Kehadiran Siswa Per Jadwal / Rombel</h2><p class="text-xs text-slate-500">Rekap absensi sesuai hak akses akun Anda.</p></div>
                        ${isAdmin || role === 'tentor' ? `<button onclick="openAbsensiSiswaModal()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow"><i class="fa-solid fa-clipboard-user mr-1"></i> Input Absensi Sesi</button>` : ''}
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 border-b text-slate-600 font-bold">
                                    <th class="p-4">Tanggal</th>
                                    <th class="p-4">Jadwal & Rombel</th>
                                    <th class="p-4">Siswa</th>
                                    <th class="p-4">Tentor</th>
                                    <th class="p-4">Mata Pelajaran</th>
                                    <th class="p-4">Materi</th>
                                    <th class="p-4">Status & Catatan</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${groups.length > 0 ? groups.map(g => {
                                    return g.items.map((a, i) => {
                                        const realIdx = DB.studentAttendance.indexOf(a);
                                        const isFirst = i === 0;
                                        const rowSpan = g.items.length;

                                        return `
                                        <tr>
                                            ${isFirst ? `<td class="p-4 font-bold border-r align-top" rowspan="${rowSpan}">${g.date}</td>` : ''}
                                            ${isFirst ? `<td class="p-4 font-bold text-indigo-600 border-r align-top" rowspan="${rowSpan}">${g.scheduleName || '-'}</td>` : ''}
                                            <td class="p-4 font-bold">${a.studentName}</td>${isFirst ? `<td class="p-4 border-r align-top font-medium" rowspan="${rowSpan}">${g.tutor}</td>` : ''}
                                            ${isFirst ? `<td class="p-4 border-r align-top" rowspan="${rowSpan}">${g.subject}</td>` : ''}
                                            ${isFirst ? `<td class="p-4 border-r align-top" rowspan="${rowSpan}">${g.material}</td>` : ''}
                                            <td class="p-4">
                                                <span class="px-2 py-0.5 ${a.status==='Hadir'?'bg-emerald-100 text-emerald-700':a.status==='Izin'?'bg-amber-100 text-amber-700':'bg-rose-100 text-rose-700'} font-bold rounded">${a.status}</span>
                                                <p class="text-slate-500 italic mt-1">Catatan: ${a.note}</p>
                                            </td>
                                            <td class="p-4 text-center space-x-1 whitespace-nowrap">
                                                <button onclick="viewAbsensiSiswaDetail(${realIdx})" class="bg-slate-100 text-slate-700 px-2 py-1 rounded font-semibold" title="Lihat Detail"><i class="fa-solid fa-eye"></i></button>

                                                ` : ''}

                                        </tr>
                                        `;
                                    }).join('');

                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderRingkasanKehadiranTab(area) {

            if (role === 'tentor') { const t = getCurrentTentor(); const ids = DB.schedules.filter(s=>s.tutorCode===t?.code || s.tutorName===t?.name).map(s=>s.id); rows=rows.filter(a=>ids.includes(a.scheduleId)||a.tutor===t?.name); }

            const stats={}; rows.forEach(a=>{const n=a.studentName||'Siswa'; if(!stats[n])stats[n]={hadir:0,total:0};stats[n].total++;if(a.status==='Hadir')stats[n].hadir++;});

        function viewStudentAttendanceReport(studentName, period) {

        function updateAbsensiStudentList() {
            const schSelect = document.getElementById('in-att-schedule');
            const container = document.getElementById('container-student-attendance-list');
            if (!schSelect || !container) return;
            const schObj = DB.schedules.find(s => String(s.id) === String(schSelect.value));
            const tutorSelect = document.getElementById('in-att-tutor');
            if (tutorSelect && schObj) {
                tutorSelect.value = schObj.tutorName || '';
            }
            const levelInput = document.getElementById('in-att-level');
            if (levelInput) levelInput.value = schObj ? (schObj.level || '-') : '';
            if (!schObj) {
                container.innerHTML = '<p class="text-amber-700 bg-amber-50 rounded-xl p-3">Belum ada jadwal yang tersedia untuk akun ini.</p>';
                return;
            }
            const enrolled = (schObj.students || []).filter(name => {
                const student = DB.students.find(st => st.name === name);
                return student && String(student.active || 'Aktif').toLowerCase() === 'aktif';
            });
            if (!enrolled.length) {
                container.innerHTML = '<p class="text-amber-700 bg-amber-50 rounded-xl p-3">Rombel ini belum memiliki siswa aktif. Periksa Jadwal Les & Rombel.</p>';

            const date = document.getElementById('in-att-date')?.value || new Date().toLocaleDateString('en-CA');
            container.innerHTML = `<p class="font-bold text-slate-600">${schObj.name} · ${enrolled.length} siswa aktif</p>` + enrolled.map(stName => {
                const existing = DB.studentAttendance.find(a => String(a.scheduleId) === String(schObj.id) && a.studentName === stName && a.date === date);

        function saveNewAbsensiSiswa(e) {
            e.preventDefault();
            const schId = document.getElementById('in-att-schedule').value;
            const schObj = DB.schedules.find(s => String(s.id) === String(schId));
            if (!schObj) { showToast('Jadwal tidak ditemukan. Periksa kembali rombel.', 'error'); return; }
            const tutorName = schObj.tutorName || '';
            const material = document.getElementById('in-att-material').value.trim();
            const date = document.getElementById('in-att-date').value;
            if (!date) { showToast('Tanggal pertemuan wajib diisi.', 'error'); return; }
            const rows = Array.from(document.querySelectorAll('.student-att-row'));
            if (!rows.length) { showToast('Tidak ada siswa aktif dalam rombel ini.', 'error'); return; }
            rows.forEach(row => {
                const stName = row.getAttribute('data-student');
                const status = row.querySelector('.att-status-sel').value;
                const note = row.querySelector('.att-note-inp').value.trim() || '-';
                const existingIdx = DB.studentAttendance.findIndex(a => String(a.scheduleId) === String(schObj.id) && a.studentName === stName && a.date === date);
                const record = { date, scheduleId: schObj.id, scheduleName: schObj.name, level: schObj.level || '', studentName: stName, tutor: tutorName, subject: schObj.name.split(' ')[0] || 'Matematika', material, status, note };
                if (existingIdx >= 0) DB.studentAttendance[existingIdx] = { ...DB.studentAttendance[existingIdx], ...record };
                else DB.studentAttendance.push({ id: Date.now() + Math.floor(Math.random() * 100000), ...record });
            });
            mbaSaveLocalData(false);
            closeModal(); renderAppLayout('absensi-siswa');
            showToast('Absensi tersimpan. Data tanggal, rombel, tentor, dan siswa sudah disinkronkan.');
        }

        function syncTutorForSchedule() {
            const scheduleId = document.getElementById('ta-schedule')?.value;
            const schedule = DB.schedules.find(s => String(s.id) === String(scheduleId));
            const tutorSelect = document.getElementById('ta-name');
            if (schedule && tutorSelect) tutorSelect.value = schedule.tutorName || '';
            const levelInput = document.getElementById('ta-level');
            if (levelInput) levelInput.value = schedule ? (schedule.level || '-') : '';
        }

        function updateTutorFeePreview() {
            const scheduleId = document.getElementById('ta-schedule')?.value;
            const schedule = DB.schedules.find(s => String(s.id) === String(scheduleId));
            if (!schedule) return;
            syncTutorForSchedule();
            const date = document.getElementById('ta-date')?.value || new Date().toLocaleDateString('en-CA');
            const attendanceForSession = DB.studentAttendance.filter(a => String(a.scheduleId) === String(schedule.id) && a.date === date);
            const attendedCount = attendanceForSession.filter(a => a.status === 'Hadir').length;
            const hasAttendance = attendanceForSession.length > 0;
            const fee = hasAttendance ? calculateFeeFromMatrix(schedule.level, attendedCount) : 0;
            const countEl = document.getElementById('preview-student-count');

        function saveTutorAtt(e, idx) {
            e.preventDefault();
            const scheduleId = document.getElementById('ta-schedule').value;
            const schedule = DB.schedules.find(s => String(s.id) === String(scheduleId));
            if (!schedule) { showToast('Pilih jadwal yang valid.', 'error'); return; }
            const date = document.getElementById('ta-date').value;
            if (!date) { showToast('Tanggal sesi wajib diisi.', 'error'); return; }
            const tutorName = schedule.tutorName || '';
            const attendanceForSession = DB.studentAttendance.filter(a => String(a.scheduleId) === String(schedule.id) && a.date === date);
            const attendedCount = attendanceForSession.filter(a => a.status === 'Hadir').length;
            if (!attendanceForSession.length) {
                showToast('Absensi siswa untuk jadwal dan tanggal ini belum diisi. Isi absensi siswa terlebih dahulu.', 'error');
                return;
            }
            const calculatedFee = attendanceForSession.length ? calculateFeeFromMatrix(schedule.level, attendedCount) : 0;
            const data = { date, scheduleId: schedule.id, level: schedule.level, tutorCode: schedule.tutorCode || '', tutorName, scheduleName: schedule.name, studentCount: attendedCount, fee: calculatedFee, feeSource: 'tuitionMatrix', note: document.getElementById('ta-note').value || 'OK' };
            if (idx !== null) DB.tutorAttendance[idx] = { ...DB.tutorAttendance[idx], ...data };
            else {
                const duplicateIdx = DB.tutorAttendance.findIndex(a => String(a.scheduleId || '') === String(schedule.id) && a.date === date);
                if (duplicateIdx >= 0) DB.tutorAttendance[duplicateIdx] = { ...DB.tutorAttendance[duplicateIdx], ...data };
                else DB.tutorAttendance.push({ id: Date.now(), ...data });
            }
            mbaSaveLocalData(false);
            closeModal(); renderAppLayout('absensi-tentor'); showToast('Absensi tentor dan fee tersinkron dengan absensi siswa yang hadir.');
        }

        function validateTutorFee(idx) {
            if (DB.currentUser.role !== 'admin' || !DB.tutorAttendance[idx]) { showToast('Hanya admin yang dapat memvalidasi fee.', 'error'); return; }

            DB.tutorAttendance[idx].validatedAt = new Date().toISOString();
            DB.tutorAttendance[idx].validatedBy = DB.currentUser.name || 'Admin';

        function openTutorFeeReceipt(monthValue) {
            if (DB.currentUser.role !== 'admin') { showToast('Struk fee hanya dapat dibuat oleh admin.', 'error'); return; }
            const month = monthValue || window._tutorReportMonth || new Date().toLocaleDateString('en-CA').slice(0,7);
            const tutors = [...new Set((DB.tutorAttendance || []).filter(t => String(t.date || '').startsWith(month) && t.adminValidated).map(t => t.tutorName).filter(Boolean))];

            openModal('Cetak Struk Tuition Fee Tentor', `<div class="space-y-3 text-sm"><p>Pilih tentor untuk membuat struk gaji bulan <b>${month}</b>. Hanya sesi yang sudah divalidasi admin yang dimasukkan.</p><label class="block font-bold">Nama Tentor</label><select id="receipt-tutor-name" class="w-full border rounded-xl px-3 py-2">${tutors.map(n=>`<option value="${n}">${n}</option>`).join('')}</select><div class="flex flex-wrap gap-2"><button onclick="printTutorFeeReceipt(document.getElementById('receipt-tutor-name').value,'${month}')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold"><i class="fa-solid fa-print mr-1"></i> Cetak / Simpan PDF</button><button onclick="shareTutorFeeReceiptWA(document.getElementById('receipt-tutor-name').value,'${month}')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold"><i class="fa-brands fa-whatsapp mr-1"></i> Kirim rincian via WA</button></div><p class="text-xs text-slate-500">Untuk PDF, pilih “Save as PDF” pada dialog cetak browser. WhatsApp membuka pesan yang sudah disiapkan; admin dapat memeriksa sebelum mengirim.</p></div>`);

            const total = rows.reduce((sum,t)=>sum+(Number(t.fee)||0),0);
            const tutor = (DB.tutors || []).find(t=>t.name===tutorName) || {};
            return {rows,total,tutor};
        }

        }

        function shareTutorFeeReceiptWA(tutorName, month) {

        // --- 8. INVOICE ---
        function moneyID(value) { const n = Number(value); return Number.isFinite(n) ? n.toLocaleString('id-ID') : '0'; }
        function safeAmount(value) { const n = Number(value); return Number.isFinite(n) && n >= 0 ? n : 0; }
        function invoicePaid(inv) {
            return DB.payments.filter(p => p.status !== 'Dibatalkan' && (p.invoiceNo === inv.invoiceNo || (!p.invoiceNo && p.studentName === inv.studentName && (p.month === inv.month || String(p.note||'').toLowerCase().includes(String(inv.month||'').toLowerCase()))))).reduce((sum,p) => sum + safeAmount(p.amount), 0);
        }
        function invoiceBalance(inv) { return Math.max(0, safeAmount(inv.total) - invoicePaid(inv)); }
        function syncInvoiceStatus(inv) {
            if (!inv || inv.status === 'Dibatalkan') return;
            const paid = invoicePaid(inv);
            inv.paidAmount = paid;
            inv.remainingAmount = Math.max(0, safeAmount(inv.total) - paid);
            inv.status = paid >= safeAmount(inv.total) ? 'Lunas' : (paid > 0 ? 'Cicilan' : (inv.deadline && inv.deadline < new Date().toISOString().slice(0,10) ? 'Jatuh Tempo' : 'Belum Lunas'));
        }

            const months = [...new Set(DB.invoices.map(i=>i.month).filter(Boolean))];

            const totalPaid = DB.invoices.reduce((n,i)=>n+Math.min(safeAmount(i.total),invoicePaid(i)),0);
            const outstanding = DB.invoices.filter(i=>i.status!=='Dibatalkan').reduce((n,i)=>n+invoiceBalance(i),0);
            const overdue = DB.invoices.filter(i=>i.status==='Jatuh Tempo').length;
            area.innerHTML = `
                <div class="space-y-5">

                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                      <div class="bg-white p-4 rounded-2xl border"><p class="text-xs text-slate-500">Total Tagihan</p><p class="text-xl font-black text-slate-800 mt-1">Rp ${moneyID(totalBill)}</p></div>
                      <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100"><p class="text-xs text-emerald-700">Sudah Dibayar</p><p class="text-xl font-black text-emerald-800 mt-1">Rp ${moneyID(totalPaid)}</p></div>
                      <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100"><p class="text-xs text-amber-700">Sisa Tagihan</p><p class="text-xl font-black text-amber-800 mt-1">Rp ${moneyID(outstanding)}</p></div>
                      <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100"><p class="text-xs text-rose-700">Tagihan Jatuh Tempo</p><p class="text-xl font-black text-rose-800 mt-1">${overdue} invoice</p></div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto"><table class="w-full text-left border-collapse text-xs"><thead><tr class="bg-slate-50 border-b text-slate-600 font-bold"><th class="p-3">No. Invoice</th><th class="p-3">Siswa</th><th class="p-3">Bulan Tagihan</th><th class="p-3">Pokok</th><th class="p-3">Diskon</th><th class="p-3">Total</th><th class="p-3">Dibayar</th><th class="p-3">Sisa</th><th class="p-3">Jatuh Tempo</th><th class="p-3">Status</th></tr></thead><tbody class="divide-y">${list.length?list.map(inv=>`<tr><td class="p-3 font-bold text-indigo-600">${inv.invoiceNo}</td><td class="p-3 font-bold">${inv.studentName||'Nama tidak tersedia'}</td><td class="p-3">${inv.month||'-'}</td><td class="p-3">Rp ${moneyID(inv.baseAmount)}</td><td class="p-3">Rp ${moneyID(inv.discount)}</td><td class="p-3 font-bold">Rp ${moneyID(inv.total)}</td><td class="p-3 text-emerald-700">Rp ${moneyID(invoicePaid(inv))}</td><td class="p-3 text-amber-700">Rp ${moneyID(invoiceBalance(inv))}</td><td class="p-3">${inv.deadline||'-'}</td><td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-bold ${inv.status==='Lunas'?'bg-emerald-100 text-emerald-700':inv.status==='Dibatalkan'?'bg-slate-100 text-slate-600':inv.status==='Jatuh Tempo'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}">${inv.status}</span><button onclick="printInvoice(${DB.invoices.indexOf(inv)})" class="block mt-2 text-indigo-600 font-bold">Lihat / Cetak</button></td></tr>`).join(''):`<tr><td colspan="10" class="p-6 text-center text-slate-400">Tidak ada invoice sesuai filter.</td></tr>`}</tbody></table></div>
                </div>`;

        function openInvoiceModal() {

            openModal('Kalkulator & Buat Invoice SPP', `<form onsubmit="saveInvoice(event)" class="space-y-3 text-xs"><div><label class="font-bold block mb-1">Pilih Siswa</label><select id="inv-student" required class="w-full px-3 py-2 border rounded-xl">${students.map((s,i)=>`<option value="${i}">${s.name} (SPP: Rp ${moneyID(s.sppBase)})</option>`).join('')}</select></div><div><label class="font-bold block mb-1">Bulan Tagihan</label><input type="month" id="inv-month" value="${new Date().toISOString().slice(0,7)}" required class="w-full px-3 py-2 border rounded-xl"></div><div><label class="font-bold block mb-1">Jatuh Tempo</label><input type="date" id="inv-deadline" value="${new Date(new Date().getFullYear(),new Date().getMonth(),20).toISOString().slice(0,10)}" required class="w-full px-3 py-2 border rounded-xl"></div><div><label class="font-bold block mb-1">Potongan Diskon (Rp)</label><input type="number" min="0" id="inv-disc" value="0" required class="w-full px-3 py-2 border rounded-xl"></div><p class="text-slate-500">Total invoice dihitung otomatis dari SPP siswa dikurangi diskon.</p><button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl shadow">Terbitkan Invoice</button></form>`);

        function saveInvoice(e) {
            e.preventDefault(); const students=DB.students.filter(s=>s&&s.name); const student=students[Number(document.getElementById('inv-student').value)];

            const [yy,mm]=monthVal.split('-'); const monthNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; const monthLabel=`${monthNames[Number(mm)-1]} ${yy}`;

              *{box-sizing:border-box}body{font:14px Arial,sans-serif;color:#172033;margin:18mm auto;max-width:180mm;line-height:1.5}.brand{text-align:center;border-bottom:2px solid #3730a3;padding-bottom:14px;margin-bottom:18px}.brand h1{font-size:21px;margin:0;color:#312e81}.brand div{font-size:13px;letter-spacing:1px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 0 18px}.meta b{font-size:11px;color:#64748b;text-transform:uppercase}table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:10px;border-bottom:1px solid #e2e8f0}td.num{text-align:right;white-space:nowrap}.strong{font-weight:bold;background:#f8fafc}.strong td{font-size:16px}.balance{font-weight:bold;color:#be123c}.note{margin-top:26px;color:#64748b;font-size:12px}.sign{text-align:right;margin-top:55px}.sign span{display:inline-block;border-top:1px solid #94a3b8;padding:8px 10px 0;min-width:220px;text-align:center}@page{size:A4;margin:12mm}@media print{body{margin:0;max-width:none}button{display:none}}</style></head><body>${content}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close();

        function exportFinanceCSV(type){
            const rows=type==='invoice'?[['No Invoice','Nama Siswa','Periode','Tanggal','Jatuh Tempo','Pokok','Diskon','Total','Dibayar','Sisa','Status'],...DB.invoices.map(i=>[i.invoiceNo,i.studentName,i.month,i.date,i.deadline,safeAmount(i.baseAmount),safeAmount(i.discount),safeAmount(i.total),invoicePaid(i),invoiceBalance(i),i.status])]:[['No Kuitansi','No Invoice','Nama Siswa','Tanggal','Periode','Keterangan','Metode','Jumlah','Status'],...DB.payments.map(p=>[p.receiptNo,p.invoiceNo||'',p.studentName,p.date,p.month,p.note,p.method||'Tunai',safeAmount(p.amount),p.status||'Tercatat'])];
            const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=(type==='invoice'?'laporan-invoice-spp':'riwayat-pembayaran-spp')+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
        }
        function numberToWordsID(num){const n=Math.floor(Math.max(0,Number(num)||0));if(n===0)return'nol';const w=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];function say(x){if(x<12)return w[x];if(x<20)return say(x-10)+' belas';if(x<100)return say(Math.floor(x/10))+' puluh '+say(x%10);if(x<200)return'seratus '+say(x-100);if(x<1000)return say(Math.floor(x/100))+' ratus '+say(x%100);if(x<2000)return'seribu '+say(x-1000);if(x<1e6)return say(Math.floor(x/1000))+' ribu '+say(x%1000);if(x<1e9)return say(Math.floor(x/1e6))+' juta '+say(x%1e6);return say(Math.floor(x/1e9))+' miliar '+say(x%1e9);}return say(n).replace(/\s+/g,' ').trim();}

        function filterQuestionBank() {

        }
        function escapeHtml(v) { return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function openQuestionEditor(idx=null) {

        function saveQuestion(e,idx){e.preventDefault();const q={id:idx===null?Date.now():(DB.questionBank[idx].id||Date.now()),title:document.getElementById('qe-title').value.trim(),subject:document.getElementById('qe-subject').value.trim(),level:document.getElementById('qe-level').value,topic:document.getElementById('qe-topic').value.trim(),content:document.getElementById('qe-content').value.trim(),totalQ:Math.max(1,(document.getElementById('qe-content').value.match(/(^|\n)\s*\d+[.)]/g)||[]).length),creator:idx===null?DB.currentUser.name:(DB.questionBank[idx].creator||DB.currentUser.name),status:document.getElementById('qe-status').value,createdAt:new Date().toISOString()};if(idx===null)DB.questionBank.push(q);else DB.questionBank[idx]={...DB.questionBank[idx],...q};mbaSaveLocalData();closeModal();renderAppLayout('ai-soal');showToast('Soal berhasil disimpan.');}

        function previewQuestion(i){const q=DB.questionBank[i];openModal('Pratinjau Soal',`<div class="space-y-3 text-sm"><div class="flex gap-2"><span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs">${escapeHtml(q.subject||'Umum')}</span><span class="px-2 py-1 bg-slate-100 rounded-lg text-xs">${escapeHtml(q.level||'Umum')}</span></div><h3 class="font-bold text-lg">${escapeHtml(q.title)}</h3><div class="whitespace-pre-wrap leading-6">${escapeHtml(q.content||'Isi soal belum ditambahkan. Silakan Edit untuk memasukkan pertanyaan dan kunci jawaban.')}</div><button onclick="printQuestion(${i})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Cetak / Simpan PDF</button></div>`);}
        function printQuestion(i){const q=DB.questionBank[i],w=window.open('','_blank');if(!w){showToast('Izinkan pop-up untuk mencetak soal.','error');return;}w.document.write(`<html><head><title>${escapeHtml(q.title)}</title><style>body{font:14px Arial;padding:32px;color:#111}h1{font-size:20px}pre{white-space:pre-wrap;font:14px Arial;line-height:1.6}</style></head><body><h1>BIMBINGAN BELAJAR MBAH AMAT</h1><h2>${escapeHtml(q.title)}</h2><p>${escapeHtml(q.subject||'Umum')} · ${escapeHtml(q.level||'Umum')}</p><pre>${escapeHtml(q.content||'')}</pre><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();}
        function openAiGeneratorModal(){openModal('Buat Soal dengan Bantuan AI',`<form onsubmit="generateQuestionDraft(event)" class="space-y-3 text-xs"><p class="p-3 bg-amber-50 border border-amber-200 rounded-xl">Generator ini menyiapkan draf lokal berdasarkan detail yang Anda isi. Koneksi API Gemini belum terpasang pada file HTML lokal; periksa dan edit draf sebelum dipakai.</p><div><label class="font-bold block mb-1">Instruksi / prompt</label><textarea id="ai-prompt" required class="w-full border rounded-xl p-2" rows="3" placeholder="Contoh: buat latihan persamaan linear satu variabel..."></textarea></div><div class="grid grid-cols-2 gap-2"><div><label class="font-bold block mb-1">Mapel</label><input id="ai-subject" class="w-full border rounded-xl p-2" placeholder="Matematika" required></div><div><label class="font-bold block mb-1">Jenjang</label><select id="ai-level" class="w-full border rounded-xl p-2"><option>SD</option><option selected>SMP</option><option>SMA</option><option>Umum</option></select></div><div><label class="font-bold block mb-1">Jumlah soal</label><input id="ai-count" type="number" min="1" max="50" value="5" class="w-full border rounded-xl p-2"></div><div><label class="font-bold block mb-1">Jenis soal</label><select id="ai-type" class="w-full border rounded-xl p-2"><option>Pilihan ganda</option><option>Esai</option><option>Campuran</option></select></div></div><div><label class="font-bold block mb-1">Unggah dokumen / kisi-kisi</label><input id="ai-file" type="file" accept=".txt,.csv,.md,.pdf,.doc,.docx" class="w-full border rounded-xl p-2"/><p class="text-slate-500 mt-1">File dipilih sebagai referensi; pembacaan isi PDF/DOCX belum aktif pada versi lokal ini. Tempelkan isi penting ke prompt untuk digunakan.</p></div><button class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">Buat Draf Soal</button></form>`);}
        function generateQuestionDraft(e){e.preventDefault();const prompt=document.getElementById('ai-prompt').value.trim(),subject=document.getElementById('ai-subject').value.trim(),level=document.getElementById('ai-level').value,count=Math.max(1,Math.min(50,Number(document.getElementById('ai-count').value)||5)),type=document.getElementById('ai-type').value,file=document.getElementById('ai-file').files[0];const content=`Instruksi materi: ${prompt}\n\nDRAF UNTUK DITINJAU (${type}, ${count} soal)\n${Array.from({length:count},(_,i)=>`${i+1}. [Lengkapi pertanyaan sesuai materi: ${prompt}]\nA. [Pilihan A]\nB. [Pilihan B]\nC. [Pilihan C]\nD. [Pilihan D]\nKunci: [Tinjau dan isi]\nPembahasan: [Tinjau dan isi]`).join('\n\n')}${file?'\n\nReferensi file yang dipilih: '+file.name:''}`;DB.questionBank.push({id:Date.now(),title:`Draf ${subject}: ${prompt.slice(0,55)}`,subject,level,topic:prompt.slice(0,80),content,totalQ:count,creator:DB.currentUser.name,status:'Perlu Ditinjau',createdAt:new Date().toISOString()});mbaSaveLocalData();closeModal();renderAppLayout('ai-soal');showToast('Draf disimpan ke Bank Soal. Tinjau dan lengkapi sebelum digunakan.','info');}
        function openExamPackageEditor(idx=null,questionIdx=null){const ex=idx===null?{}:DB.examPackages[idx],selected=ex.questionIds|| (questionIdx===null?[]:[DB.questionBank[questionIdx]?.id]);openModal(idx===null?'Buat Paket Ujian CBT':'Edit Paket Ujian CBT',`<form onsubmit="saveExamPackage(event,${idx===null?'null':idx})" class="space-y-3 text-xs"><div><label class="font-bold block mb-1">Nama paket ujian</label><input id="ep-title" required class="w-full border rounded-xl p-2" value="${escapeHtml(ex.title||'')}"></div><div class="grid grid-cols-2 gap-2"><div><label class="font-bold block mb-1">Mapel</label><input id="ep-subject" class="w-full border rounded-xl p-2" value="${escapeHtml(ex.subject||'')}"></div><div><label class="font-bold block mb-1">Jenjang</label><select id="ep-level" class="w-full border rounded-xl p-2"><option>SD</option><option selected>SMP</option><option>SMA</option><option>Umum</option></select></div><div><label class="font-bold block mb-1">Durasi (menit)</label><input id="ep-duration" type="number" min="1" value="${Number(ex.duration)||30}" class="w-full border rounded-xl p-2"></div><div><label class="font-bold block mb-1">Batas percobaan</label><input id="ep-attempts" type="number" min="1" value="${Number(ex.attempts)||1}" class="w-full border rounded-xl p-2"></div><div><label class="font-bold block mb-1">Jadwal mulai</label><input id="ep-start" type="datetime-local" class="w-full border rounded-xl p-2" value="${escapeHtml(ex.startAt||'')}"></div><div><label class="font-bold block mb-1">Tenggat</label><input id="ep-due" type="datetime-local" class="w-full border rounded-xl p-2" value="${escapeHtml(ex.dueAt||'')}"></div></div><div><label class="font-bold block mb-1">Nilai kelulusan</label><input id="ep-pass" type="number" min="0" max="100" value="${Number(ex.passScore)||70}" class="w-full border rounded-xl p-2"></div><div><label class="font-bold block mb-2">Pilih soal</label><div class="max-h-44 overflow-y-auto border rounded-xl p-2 space-y-2">${DB.questionBank.filter(q=>q.status!=='Diarsipkan').map(q=>`<label class="flex gap-2 items-start"><input type="checkbox" name="ep-question" value="${q.id}" ${selected.includes(q.id)?'checked':''}><span>${escapeHtml(q.title)} <small class="text-slate-500">(${escapeHtml(q.subject||'Umum')} · ${Number(q.totalQ)||1} soal)</small></span></label>`).join('')||'<p class="text-slate-400">Tambahkan soal terlebih dahulu.</p>'}</div></div><div><label class="font-bold block mb-1">Status</label><select id="ep-status" class="w-full border rounded-xl p-2"><option ${!ex.status||ex.status==='Draft'?'selected':''}>Draft</option><option ${ex.status==='Diterbitkan'?'selected':''}>Diterbitkan</option><option ${ex.status==='Ditutup'?'selected':''}>Ditutup</option></select></div><button class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">Simpan Paket Ujian</button></form>`);}
        function saveExamPackage(e,idx){e.preventDefault();const x={id:idx===null?Date.now():DB.examPackages[idx].id,title:document.getElementById('ep-title').value.trim(),subject:document.getElementById('ep-subject').value.trim(),level:document.getElementById('ep-level').value,duration:Number(document.getElementById('ep-duration').value)||30,attempts:Number(document.getElementById('ep-attempts').value)||1,startAt:document.getElementById('ep-start').value,dueAt:document.getElementById('ep-due').value,passScore:Number(document.getElementById('ep-pass').value)||70,questionIds:[...document.querySelectorAll('[name="ep-question"]:checked')].map(e=>Number(e.value)),status:document.getElementById('ep-status').value,creator:DB.currentUser.name};if(idx===null)DB.examPackages.push(x);else DB.examPackages[idx]=x;mbaSaveLocalData();closeModal();renderAppLayout('ai-soal');setTimeout(()=>switchQuestionView('paket'),0);showToast('Paket ujian tersimpan.');}
        function previewExamPackage(i){const x=DB.examPackages[i],qs=DB.questionBank.filter(q=>(x.questionIds||[]).includes(q.id));openModal('Pratinjau Paket Ujian',`<div class="space-y-3 text-sm"><h3 class="text-lg font-bold">${escapeHtml(x.title)}</h3><p>${escapeHtml(x.subject||'Umum')} · ${escapeHtml(x.level||'Umum')} · ${x.duration} menit · Lulus ${x.passScore}</p>${qs.map(q=>`<div class="border rounded-xl p-3"><b>${escapeHtml(q.title)}</b><pre class="whitespace-pre-wrap mt-2 text-xs">${escapeHtml(q.content||'')}</pre></div>`).join('')||'<p>Belum ada soal yang dipilih.</p>'}<button onclick="printExamPackage(${i})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Cetak / Simpan PDF</button></div>`);}
        function printExamPackage(i){const x=DB.examPackages[i],qs=DB.questionBank.filter(q=>(x.questionIds||[]).includes(q.id)),w=window.open('','_blank');if(!w){showToast('Izinkan pop-up untuk mencetak.','error');return;}w.document.write(`<html><head><title>${escapeHtml(x.title)}</title><style>body{font:14px Arial;padding:32px}pre{white-space:pre-wrap;font:14px Arial;line-height:1.5}.q{border-bottom:1px solid #ddd;padding:12px 0}</style></head><body><h1>BIMBINGAN BELAJAR MBAH AMAT</h1><h2>${escapeHtml(x.title)}</h2><p>${escapeHtml(x.subject||'Umum')} · Durasi ${x.duration} menit</p>${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${escapeHtml(q.title)}</b><pre>${escapeHtml(q.content||'')}</pre></div>`).join('')}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();}
        function shareExamPackage(i){const x=DB.examPackages[i],msg=`Bimbingan Belajar Mbah Amat\nUjian: ${x.title}\nMata pelajaran: ${x.subject||'Umum'}\nJenjang: ${x.level||'Umum'}\nDurasi: ${x.duration} menit\n${x.dueAt?'Tenggat: '+x.dueAt+'\n':''}Silakan hubungi admin/tentor untuk akses ujian.`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');}
        function startPackageExam(i){const x=DB.examPackages[i],qs=DB.questionBank.filter(q=>(x.questionIds||[]).includes(q.id));if(!qs.length){showToast('Paket belum memiliki soal.','error');return;}if(x.status==='Ditutup'){showToast('Paket ujian ini sudah ditutup.','error');return;}openModal('CBT: '+x.title,`<form onsubmit="submitPackageExam(event,${i})" class="space-y-4 text-xs"><div class="bg-indigo-50 border rounded-xl p-3 flex justify-between"><b>${escapeHtml(x.subject||'Umum')} · ${qs.length} item bank</b><span>Durasi ${x.duration} menit</span></div>${qs.map((q,j)=>`<div class="border rounded-xl p-3"><p class="font-bold mb-2">${j+1}. ${escapeHtml(q.title)}</p><pre class="whitespace-pre-wrap font-sans mb-2">${escapeHtml(q.content||'')}</pre><label class="block font-bold mb-1">Jawaban siswa</label><textarea name="answer-${j}" rows="2" class="w-full border rounded-lg p-2" placeholder="Tuliskan jawaban..." ></textarea></div>`).join('')}<button class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold">Kirim Jawaban</button></form>`);}
        function submitPackageExam(e,i){e.preventDefault();const x=DB.examPackages[i],qs=DB.questionBank.filter(q=>(x.questionIds||[]).includes(q.id));const answers=qs.map((q,j)=>({question:q.title,answer:e.target.querySelector(`[name="answer-${j}"]`).value}));const result={id:Date.now(),date:new Date().toISOString().slice(0,10),student:DB.currentUser.name,title:x.title,score:0,detail:`${answers.filter(a=>a.answer.trim()).length}/${answers.length} jawaban terisi; menunggu penilaian` ,answers,needsGrading:true};DB.examResults.push(result);mbaSaveLocalData();closeModal();renderAppLayout('ai-soal');setTimeout(()=>switchQuestionView('hasil'),0);showToast('Jawaban tersimpan. Nilai esai perlu diperiksa tentor/admin.');}
        function exportExamResults(){const rows=[['Tanggal','Siswa','Paket Ujian','Nilai','Detail'],...DB.examResults.map(r=>[r.date,r.student,r.title,r.score,r.detail])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='hasil-ujian-cbt.csv';a.click();URL.revokeObjectURL(a.href);}

        // --- 12. PROGRES SISWA (Filtered by Student Name) ---
        function renderProgresTab(area) {
            const role = DB.currentUser.role;
            let studentName = '';
            
            if (role === 'siswa' || role === 'ortu') {
                const names = getCurrentUserStudentNames();
                studentName = names[0] || DB.currentUser.name;
            } else {
                studentName = DB.students[0] ? DB.students[0].name : 'Ani Lestari';
            }

            const studentAtts = DB.studentAttendance.filter(a => a.studentName.toLowerCase() === studentName.toLowerCase());
            const hadirCount = studentAtts.filter(a => a.status === 'Hadir').length;
            const kehadiranPersen = Math.round((hadirCount / Math.max(1, studentAtts.length)) * 100);

            area.innerHTML = `
                <div class="space-y-6">
                    <div><h2 class="text-xl font-bold text-slate-800">Progres Belajar & Nilai Siswa</h2><p class="text-xs text-slate-500">Pantauan hasil ujian CBT dan rekap kehadiran riil untuk: <span class="text-indigo-600 font-bold">${studentName}</span></p></div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex justify-between items-center"><h4 class="font-bold text-slate-800">${studentName}</h4><span class="px-3 py-1 bg-indigo-100 text-indigo-700 font-bold rounded-full text-xs">Kehadiran ${isNaN(kehadiranPersen) ? 100 : kehadiranPersen}%</span></div>
                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div class="bg-slate-50 p-4 rounded-xl border"><p class="text-xs text-slate-500">Nilai CBT Terakhir</p><p class="text-2xl font-black text-indigo-600">90</p></div>
                            <div class="bg-slate-50 p-4 rounded-xl border"><p class="text-xs text-slate-500">Sesi Hadir</p><p class="text-2xl font-black text-emerald-600">${hadirCount} Sesi</p></div>
                            <div class="bg-slate-50 p-4 rounded-xl border"><p class="text-xs text-slate-500">Status Siswa</p><p class="text-2xl font-black text-amber-600">Aktif</p></div>
                        </div>
                        <div class="mt-4 pt-4 border-t">
                            <p class="font-bold text-xs text-slate-700 mb-2">Riwayat Materi & Catatan Kehadiran:</p>
                            <div class="space-y-2 max-h-36 overflow-y-auto">
                                ${studentAtts.length > 0 ? studentAtts.map(a => `
                                    <div class="p-2 bg-slate-50 rounded-lg border text-xs flex justify-between">
                                        <span><strong>${a.date}</strong> - ${a.scheduleName} (${a.material})</span>
                                        <span class="font-bold text-emerald-600">${a.status}</span>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic">Belum ada catatan absensi tercatat.</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openModal(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('global-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('global-modal').classList.add('hidden'); }

        function openProfileModal() {
            openModal('Profil Akun', `
                <form onsubmit="updateProfile(event)" class="space-y-3 text-xs">
                    <div><label class="font-bold block mb-1">Nama</label><input type="text" id="p-name" value="${DB.currentUser.name}" required class="w-full px-3 py-2 border rounded-xl"></div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-xl shadow">Simpan</button>
                </form>
            `);
        }

        function updateProfile(e) {
            e.preventDefault();
            DB.currentUser.name = document.getElementById('p-name').value;
            document.getElementById('top-username').innerText = DB.currentUser.name;
            closeModal(); showToast('Profil diperbarui.');
        }
    </script>
</body>
</html>
