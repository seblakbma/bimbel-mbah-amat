    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }

        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen">
        <!-- Rendered dynamically via JavaScript based on Auth state -->
    </div>

    <script>
        // --- INITIAL MOCK DATABASE & LOCALSTORAGE INITIALIZATION ---
        const DEFAULT_USERS = [
            { id: 1, username: 'Admin', pass: '123456', role: 'admin', name: 'Mbah Amat (Owner)', email: 'admin@mbahamat.com', phone: '081234567890', status: 'aktif' },
            { id: 2, username: 'tentor1', pass: '123456', role: 'tentor', name: 'Budi Santoso, S.Pd', email: 'budi@mbahamat.com', phone: '081345678901', status: 'aktif' },
            { id: 3, username: 'siswa1', pass: '123456', role: 'siswa', name: 'Ahmad Fauzi', email: 'ahmad@gmail.com', phone: '081567890123', status: 'aktif', jenjang: 'SMA', kelas: '12 IPA', orangTua: 'H. Sudirman' },
            { id: 4, username: 'ortu1', pass: '123456', role: 'ortu', name: 'H. Sudirman (Wali Ahmad)', email: 'sudirman@gmail.com', phone: '081890123456', status: 'aktif', childUsername: 'siswa1' }
        ];

        const DEFAULT_STUDENTS = [
            { id: 1, name: 'Ahmad Fauzi', username: 'siswa1', tanggalLahir: '2008-05-12', agama: 'Islam', jenisKelamin: 'Laki-laki', wa: '081567890123', namaOrtu: 'H. Sudirman', waOrtu: '081890123456', asalSekolah: 'SMA N 1 Jakarta', jenjang: 'SMA', kelas: '12 IPA', tglTerdaftar: '2024-01-10', status: 'aktif' },
            { id: 2, name: 'Siti Rahma', username: 'siswa2', tanggalLahir: '2009-08-20', agama: 'Islam', jenisKelamin: 'Perempuan', wa: '081234509876', namaOrtu: 'Ibu Aminah', waOrtu: '081234509877', asalSekolah: 'SMP N 5 Jakarta', jenjang: 'SMP', kelas: '8B', tglTerdaftar: '2024-02-15', status: 'aktif' }
        ];

        const DEFAULT_TENTORS = [
            { id: 1, name: 'Budi Santoso, S.Pd', username: 'tentor1', spesialisasi: 'Matematika & Fisika', wa: '081345678901', status: 'aktif' },
            { id: 2, name: 'Dewi Lestari, M.Sc', username: 'tentor2', spesialisasi: 'Biologi & Kimia', wa: '081987654321', status: 'aktif' }
        ];

        const DEFAULT_CLASSES = [
            { id: 1, jenjang: 'SMA', kelas: '12 IPA', hari: 'Senin', jam: '15:30 - 17:00', ruang: 'Ruang 1', tentor: 'Budi Santoso, S.Pd', slotMax: 6, siswaList: ['Ahmad Fauzi'] },
            { id: 2, jenjang: 'SMP', kelas: '8B', hari: 'Selasa', jam: '16:00 - 17:30', ruang: 'Ruang 2', tentor: 'Dewi Lestari, M.Sc', slotMax: 6, siswaList: ['Siti Rahma'] }
        ];

        const DEFAULT_TARIFFS = {
            bulanan: { SD: 250000, SMP: 350000, SMA: 500000 },
            perPertemuan: { SD: 30000, SMP: 40000, SMA: 50000 }
        };

        const DEFAULT_TUTOR_FEES = {
            SD: { 1: 25000, 2: 30000, 3: 35000, 4: 40000, 5: 45000, 6: 50000 },
            SMP: { 1: 30000, 2: 38000, 3: 45000, 4: 52000, 5: 60000, 6: 70000 },
            SMA: { 1: 35000, 2: 45000, 3: 55000, 4: 65000, 5: 75000, 6: 90000 }
        };

        const DEFAULT_BANK_SOAL = [
            { id: 1, title: 'Latihan Ujian Matematika Turunan Fungsi', jenjang: 'SMA', kelas: '12 IPA', soalCount: 5, date: '2026-06-01', soalData: [
                { q: 'Turunan pertama dari f(x) = 3x^2 + 5x - 2 adalah...', options: ['6x + 5', '6x - 5', '3x + 5', '5x + 3'], ans: 0, pembahasan: 'f\'(x) = 2.3x^(2-1) + 5 = 6x + 5' },
                { q: 'Jika f(x) = (2x - 1)^3, maka f\'(x) = ...', options: ['6(2x-1)^2', '3(2x-1)^2', '2(2x-1)^2', '12(2x-1)^2'], ans: 0, pembahasan: 'Gunakan aturan rantai: 3(2x-1)^2 * 2 = 6(2x-1)^2' }
            ]}
        ];

        const DEFAULT_ATTENDANCE = [
            { id: 1, tanggal: '2026-10-01', kelas: '12 IPA', siswa: 'Ahmad Fauzi', status: 'Hadir', tentorCheck: true, siswaCheck: true, materi: 'Pengantar Turunan Lanjut' }
        ];

        const DEFAULT_INVOICES = [
            { id: 'INV-2026-001', siswa: 'Ahmad Fauzi', jenjang: 'SMA', paket: 'Bulanan', tagihanPokok: 500000, diskon: 0, total: 500000, batasBayar: '2026-10-20', status: 'Belum Lunas' }
        ];

        const DEFAULT_PAYMENTS = [
            { id: 'KW-001', tanggal: '2026-10-02', siswa: 'Siti Rahma', jenis: 'Pembayaran SPP', jumlah: 350000, barcode: 'BIMBEL-AMAT-PAY-98312' }
        ];

        // Init localStorage if empty
        function initStorage() {
            if (!localStorage.getItem('users')) localStorage.setItem('users', JSON.stringify(DEFAULT_USERS));
            if (!localStorage.getItem('students')) localStorage.setItem('students', JSON.stringify(DEFAULT_STUDENTS));
            if (!localStorage.getItem('tentors')) localStorage.setItem('tentors', JSON.stringify(DEFAULT_TENTORS));
            if (!localStorage.getItem('classes')) localStorage.setItem('classes', JSON.stringify(DEFAULT_CLASSES));
            if (!localStorage.getItem('tariffs')) localStorage.setItem('tariffs', JSON.stringify(DEFAULT_TARIFFS));
            if (!localStorage.getItem('tutorFees')) localStorage.setItem('tutorFees', JSON.stringify(DEFAULT_TUTOR_FEES));
            if (!localStorage.getItem('bankSoal')) localStorage.setItem('bankSoal', JSON.stringify(DEFAULT_BANK_SOAL));
            if (!localStorage.getItem('attendance')) localStorage.setItem('attendance', JSON.stringify(DEFAULT_ATTENDANCE));
            if (!localStorage.getItem('invoices')) localStorage.setItem('invoices', JSON.stringify(DEFAULT_INVOICES));
            if (!localStorage.getItem('payments')) localStorage.setItem('payments', JSON.stringify(DEFAULT_PAYMENTS));
            if (!localStorage.getItem('currentUser')) localStorage.setItem('currentUser', null);
        }
        initStorage();

        // State Management helpers
        function getDB(key) { return JSON.parse(localStorage.getItem(key)); }
        function saveDB(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
        function getCurrentUser() {
            const u = localStorage.getItem('currentUser');
            return u && u !== 'null' ? JSON.parse(u) : null;
        }
        function setCurrentUser(user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
            renderApp();
        }

        // UI Toast Notification helper
        function showToast(msg, type = 'success') {
            const old = document.getElementById('toast-box');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.id = 'toast-box';
            toast.className = `fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-medium text-sm transition-all transform translate-y-0 flex items-center gap-3 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // Main App Router & Renderer
        let currentTab = 'dashboard';
        let subViewParams = {};

        function renderApp() {
            const user = getCurrentUser();
            const appEl = document.getElementById('app');
            if (!user) {
                appEl.innerHTML = renderAuthScreen();
            } else {
                appEl.innerHTML = renderMainLayout(user);
                attachEventHandlers(user);
            }
        }

        // --- AUTHENTICATION SCREEN ---
        let authMode = 'login'; // 'login' or 'register'
        function renderAuthScreen() {
            return `
            <div class="min-h-screen bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 flex items-center justify-center p-4">
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl w-full max-w-md p-8 border border-white/20">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30 mb-3">
                            <i class="fa-solid fa-graduation-cap"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-900">Bimbel Mbah Amat</h1>
                        <p class="text-sm text-slate-500 mt-1">Sistem Informasi Bimbingan Belajar Real-Time</p>
                    </div>

                    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                        <button onclick="authMode='login'; renderApp();" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${authMode==='login'?'bg-white text-blue-600 shadow-sm':'text-slate-500 hover:text-slate-800'}">Log In</button>
                        <button onclick="authMode='register'; renderApp();" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${authMode==='register'?'bg-white text-blue-600 shadow-sm':'text-slate-500 hover:text-slate-800'}">Daftar Akun</button>
                    </div>

                    ${authMode === 'login' ? `
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan username">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan password">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
                                <span>Masuk Aplikasi</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            </button>
                        </form>
                        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
                            <p class="font-medium mb-1">Akun Demo Default:</p>
                            <p class="text-slate-600">Admin: <span class="font-bold text-blue-600">Admin</span> / <span class="font-bold text-blue-600">123456</span></p>
                            <p class="text-slate-600">Tentor: <span class="font-bold text-blue-600">tentor1</span> / <span class="font-bold text-blue-600">123456</span> | Siswa: <span class="font-bold text-blue-600">siswa1</span> / <span class="font-bold text-blue-600">123456</span></p>
                        </div>
                    ` : `
                        <form onsubmit="handleRegister(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nama Lengkap</label>
                                <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nama lengkap Anda">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username Baru</label>
                                    <input type="text" id="reg-username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Username">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                                    <input type="password" id="reg-password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Pilih Peran (Role)</label>
                                <select id="reg-role" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="siswa">Siswa</option>
                                    <option value="ortu">Orang Tua</option>
                                    <option value="tentor">Tentor / Pengajar</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                                <span>Daftar Sekarang</span> <i class="fa-solid fa-user-plus"></i>
                            </button>
                        </form>
                    `}
                </div>
            </div>`;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const users = getDB('users');
            const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pass === p);
            if (found) {
                setCurrentUser(found);
                showToast(`Selamat datang, ${found.name}!`);
            } else {
                showToast('Username atau Password salah!', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            const role = document.getElementById('reg-role').value;
            const users = getDB('users');
            if (users.some(x => x.username.toLowerCase() === username.toLowerCase())) {
                showToast('Username sudah terdaftar!', 'error');
                return;
            }
            const newUser = { id: Date.now(), name, username, pass, role, status: 'aktif', email: `${username}@gmail.com`, phone: '08123456789' };
            users.push(newUser);
            saveDB('users', users);
            // Also add to students/tentors if needed
            if (role === 'siswa') {
                const students = getDB('students');
                students.push({ id: Date.now(), name, username, jenjang: 'SMA', kelas: '12 IPA', status: 'aktif' });
                saveDB('students', students);
            }
            setCurrentUser(newUser);
            showToast(`Pendaftaran berhasil! Default akun: ${username} / ${pass}`);
        }

        // --- MAIN APPLICATION LAYOUT (RESPONSIVE SIDEBAR + HEADER + CONTENT) ---
        function renderMainLayout(user) {
            return `
            <div class="flex h-screen bg-slate-50 overflow-hidden">
                <!-- Sidebar (Proporsional & Responsive) -->
                <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col transition-all duration-300 z-30 md:static fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 shadow-2xl">
                    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-md shadow-blue-500/20">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-white text-base leading-tight">Bimbel Mbah Amat</h2>
                                <span class="text-xs text-blue-400 font-medium capitalize">Role: ${user.role}</span>
                            </div>
                        </div>
                        <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>

                    <!-- Navigation Links -->
                    <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                        <div class="text-xs font-semibold uppercase text-slate-500 px-3 mb-2">Menu Utama</div>
                        <a href="#" onclick="switchTab('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='dashboard'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}">
                            <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
                        </a>
                        <a href="#" onclick="switchTab('jadwal')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='jadwal'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}">
                            <i class="fa-solid fa-calendar-days w-5 text-center"></i> Jadwal & Kelas
                        </a>
                        <a href="#" onclick="switchTab('absensi')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='absensi'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}">
                            <i class="fa-solid fa-clipboard-user w-5 text-center"></i> Check-In & Absensi
                        </a>
                        <a href="#" onclick="switchTab('materi')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='materi'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}">
                            <i class="fa-solid fa-book-open w-5 text-center"></i> Materi & Bank Soal (AI)
                        </a>

                        ${user.role === 'admin' ? `
                            <div class="text-xs font-semibold uppercase text-slate-500 px-3 mt-6 mb-2">Manajemen Admin</div>
                            <a href="#" onclick="switchTab('users')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='users'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-users-gear w-5 text-center"></i> Kelola Akun User</a>
                            <a href="#" onclick="switchTab('students')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='students'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-user-graduate w-5 text-center"></i> Data Siswa & Pendaftaran</a>
                            <a href="#" onclick="switchTab('tentors')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='tentors'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-chalkboard-user w-5 text-center"></i> Data Tentor</a>
                            <a href="#" onclick="switchTab('keuangan')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='keuangan'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> SPP, Invoice & Kwitansi</a>
                            <a href="#" onclick="switchTab('matriks')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='matriks'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-table-cells w-5 text-center"></i> Matriks Tarif & Fee Tentor</a>
                        ` : ''}

                        ${user.role === 'tentor' ? `
                            <div class="text-xs font-semibold uppercase text-slate-500 px-3 mt-6 mb-2">Menu Tentor</div>
                            <a href="#" onclick="switchTab('tentor_kelas')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='tentor_kelas'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-chalkboard w-5 text-center"></i> Preview Kelas & Fee</a>
                        ` : ''}

                        ${user.role === 'siswa' ? `
                            <div class="text-xs font-semibold uppercase text-slate-500 px-3 mt-6 mb-2">Menu Siswa</div>
                            <a href="#" onclick="switchTab('ujian')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='ujian'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-file-pen w-5 text-center"></i> Kuis & Ujian Real-Time</a>
                            <a href="#" onclick="switchTab('progres')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='progres'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-award w-5 text-center"></i> Progres & Nilai Belajar</a>
                        ` : ''}

                        ${user.role === 'ortu' ? `
                            <div class="text-xs font-semibold uppercase text-slate-500 px-3 mt-6 mb-2">Menu Orang Tua</div>
                            <a href="#" onclick="switchTab('ortu_pantau')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${currentTab==='ortu_pantau'?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'hover:bg-slate-800 text-slate-300'}"><i class="fa-solid fa-shield-heart w-5 text-center"></i> Pantau Anak & Invoice PDF</a>
                        ` : ''}
                    </div>

                    <!-- Sidebar Footer -->
                    <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex items-center justify-between">
                        <div class="truncate pr-2">
                            <p class="text-xs font-bold text-white truncate">${user.name}</p>
                            <p class="text-[10px] text-slate-400 capitalize">@${user.username}</p>
                        </div>
                        <button onclick="logout()" title="Logout" class="w-9 h-9 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white rounded-xl flex items-center justify-center transition-all"><i class="fa-solid fa-power-off"></i></button>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                    <!-- Top Navbar -->
                    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-20 shadow-sm">
                        <div class="flex items-center gap-4">
                            <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-600 hover:text-slate-900 text-lg"><i class="fa-solid fa-bars"></i></button>
                            <h1 class="font-bold text-slate-800 text-lg capitalize flex items-center gap-2">
                                <i class="fa-solid fa-cube text-blue-600"></i> <span id="page-title-text">${currentTab}</span>
                            </h1>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full text-xs font-medium text-slate-600">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>Real-Time Online Active</span>
                            </div>
                            <div class="relative">
                                <button onclick="openProfileModal()" class="flex items-center gap-2 hover:bg-slate-100 p-1.5 rounded-xl transition-all">
                                    <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-bold text-sm">${user.name.charAt(0)}</div>
                                    <span class="text-sm font-semibold text-slate-700 hidden sm:inline">${user.name}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Scrollable Dynamic Content -->
                    <main class="flex-1 overflow-y-auto p-6">
                        ${renderTabContent(user)}
                    </main>
                </div>
            </div>`;
        }

        function switchTab(tab) {
            currentTab = tab;
            renderApp();
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            setCurrentUser(null);
            showToast('Anda telah berhasil logout.');
        }

        // --- TAB CONTENT ROUTER ---
        function renderTabContent(user) {
            switch(currentTab) {
                case 'dashboard': return renderDashboard(user);
                case 'jadwal': return renderJadwal(user);
                case 'absensi': return renderAbsensi(user);
                case 'materi': return renderMateri(user);
                case 'users': return renderUsersAdmin(user);
                case 'students': return renderStudentsAdmin(user);
                case 'tentors': return renderTentorsAdmin(user);
                case 'keuangan': return renderKeuanganAdmin(user);
                case 'matriks': return renderMatriksAdmin(user);
                case 'tentor_kelas': return renderTentorKelas(user);
                case 'ujian': return renderUjianSiswa(user);
                case 'progres': return renderProgresSiswa(user);
                case 'ortu_pantau': return renderOrtuPantau(user);
                default: return `<div class="p-6 bg-white rounded-2xl shadow-sm">Halaman tidak ditemukan.</div>`;
            }
        }

        // --- DASHBOARD VIEW ---
        function renderDashboard(user) {
            const students = getDB('students');
            const tentors = getDB('tentors');
            const classes = getDB('classes');
            const attendance = getDB('attendance');

            return `
            <div class="space-y-6">
                <!-- Welcome Banner -->
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-8 text-white shadow-xl shadow-blue-600/20 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div>
                        <div class="inline-flex items-center gap-2 bg-white/10 px-3 py-1 rounded-full text-xs font-medium mb-3 backdrop-blur-md">
                            <i class="fa-solid fa-sparkles text-amber-300"></i> Bimbingan Belajar Mbah Amat Real-Time System
                        </div>
                        <h2 class="text-3xl font-extrabold tracking-tight">Halo, ${user.name}! 👋</h2>
                        <p class="text-blue-100 text-sm mt-1 max-w-xl">Selamat datang di portal akademik Bimbel Mbah Amat. Semua jadwal, absensi, kuis AI, dan keuangan Anda tersinkronisasi secara real-time.</p>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-2xl text-center min-w-[160px]">
                        <p class="text-xs text-blue-200 uppercase font-semibold">Status Akun</p>
                        <p class="text-xl font-bold mt-1 capitalize">${user.role}</p>
                    </div>
                </div>

                <!-- Quick Stats Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Siswa Aktif</p>
                            <h3 class="text-2xl font-extrabold text-slate-800 mt-1">${students.filter(s=>s.status==='aktif').length}</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-user-graduate"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Tentor</p>
                            <h3 class="text-2xl font-extrabold text-slate-800 mt-1">${tentors.length}</h3>
                        </div>
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-chalkboard-user"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Kelas Aktif</p>
                            <h3 class="text-2xl font-extrabold text-slate-800 mt-1">${classes.length}</h3>
                        </div>
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-door-open"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Absensi Tercatat</p>
                            <h3 class="text-2xl font-extrabold text-slate-800 mt-1">${attendance.length} Sesi</h3>
                        </div>
                        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-clipboard-check"></i></div>
                    </div>
                </div>

                <!-- Recent Activities / Quick Overview -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-bullhorn text-blue-600"></i> Pengumuman & Berita Bimbel</h3>
                        <div class="space-y-3">
                            <div class="p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
                                <p class="text-xs font-bold text-blue-600">10 Oktober 2026</p>
                                <p class="text-sm font-semibold text-slate-800 mt-0.5">Ujian Bulanan & Tryout UTBK Real-Time</p>
                                <p class="text-xs text-slate-600 mt-1">Seluruh siswa tingkat SMA diwajibkan mengerjakan soal latihan AI Gemini yang telah di-post oleh tentor.</p>
                            </div>
                            <div class="p-4 bg-slate-50 border border-slate-100 rounded-xl">
                                <p class="text-xs font-bold text-slate-500">01 Oktober 2026</p>
                                <p class="text-sm font-semibold text-slate-800 mt-0.5">Pembayaran SPP Tepat Waktu</p>
                                <p class="text-xs text-slate-600 mt-1">Batas akhir pembayaran SPP setiap bulannya adalah tanggal 20. Invoice otomatis telah diterbitkan.</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-500"></i> Akses Cepat Fitur</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="switchTab('jadwal')" class="p-4 rounded-xl border border-slate-100 hover:border-blue-500 hover:bg-blue-50/30 transition-all text-left group">
                                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-bold mb-2 group-hover:scale-110 transition-transform"><i class="fa-solid fa-calendar"></i></div>
                                <p class="font-bold text-slate-800 text-sm">Lihat Jadwal</p>
                                <p class="text-xs text-slate-500 mt-0.5">Cek kelas & ruang</p>
                            </button>
                            <button onclick="switchTab('absensi')" class="p-4 rounded-xl border border-slate-100 hover:border-emerald-500 hover:bg-emerald-50/30 transition-all text-left group">
                                <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center font-bold mb-2 group-hover:scale-110 transition-transform"><i class="fa-solid fa-check-to-slot"></i></div>
                                <p class="font-bold text-slate-800 text-sm">Check-In Absen</p>
                                <p class="text-xs text-slate-500 mt-0.5">Tandai kehadiran</p>
                            </button>
                            <button onclick="switchTab('materi')" class="p-4 rounded-xl border border-slate-100 hover:border-indigo-500 hover:bg-indigo-50/30 transition-all text-left group">
                                <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center font-bold mb-2 group-hover:scale-110 transition-transform"><i class="fa-solid fa-brain"></i></div>
                                <p class="font-bold text-slate-800 text-sm">Bank Soal AI</p>
                                <p class="text-xs text-slate-500 mt-0.5">Generate soal Gemini</p>
                            </button>
                            <button onclick="switchTab('keuangan')" class="p-4 rounded-xl border border-slate-100 hover:border-amber-500 hover:bg-amber-50/30 transition-all text-left group">
                                <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center font-bold mb-2 group-hover:scale-110 transition-transform"><i class="fa-solid fa-file-invoice"></i></div>
                                <p class="font-bold text-slate-800 text-sm">Invoice & SPP</p>
                                <p class="text-xs text-slate-500 mt-0.5">Tagihan & kwitansi</p>
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // --- JADWAL & KELAS VIEW ---
        let jadwalViewMode = 'list'; // 'list' or 'weekly'
        let filterJenjang = 'all';
        let filterHari = 'all';

        function renderJadwal(user) {
            const classes = getDB('classes');
            const students = getDB('students');
            const tentors = getDB('tentors');

            const filtered = classes.filter(c => {
                if (filterJenjang !== 'all' && c.jenjang !== filterJenjang) return false;
                if (filterHari !== 'all' && c.hari !== filterHari) return false;
                return true;
            });

            return `
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">Manajemen Kelas & Jadwal Bimbel</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Dikelola berdasarkan jenjang, kelas, hari, ruang, dan slot siswa.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button onclick="jadwalViewMode='list'; renderApp();" class="px-3 py-1.5 text-xs font-semibold rounded-lg ${jadwalViewMode==='list'?'bg-white text-blue-600 shadow-sm':'text-slate-600'}">List Tabel</button>
                            <button onclick="jadwalViewMode='weekly'; renderApp();" class="px-3 py-1.5 text-xs font-semibold rounded-lg ${jadwalViewMode==='weekly'?'bg-white text-blue-600 shadow-sm':'text-slate-600'}">Mode 1 Minggu</button>
                        </div>
                        ${user.role === 'admin' ? `
                            <button onclick="openClassModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/30 flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> <span>Tambah Kelas</span>
                            </button>
                        ` : ''}
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap gap-4 items-center">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase text-slate-500">Jenjang:</span>
                        <select onchange="filterJenjang=this.value; renderApp();" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all" ${filterJenjang==='all'?'selected':''}>Semua Jenjang</option>
                            <option value="SD" ${filterJenjang==='SD'?'selected':''}>SD</option>
                            <option value="SMP" ${filterJenjang==='SMP'?'selected':''}>SMP</option>
                            <option value="SMA" ${filterJenjang==='SMA'?'selected':''}>SMA</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase text-slate-500">Hari:</span>
                        <select onchange="filterHari=this.value; renderApp();" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all" ${filterHari==='all'?'selected':''}>Semua Hari</option>
                            <option value="Senin">Senin</option>
                            <option value="Selasa">Selasa</option>
                            <option value="Rabu">Rabu</option>
                            <option value="Kamis">Kamis</option>
                            <option value="Jumat">Jumat</option>
                            <option value="Sabtu">Sabtu</option>
                            <option value="Minggu">Minggu</option>
                        </select>
                    </div>
                </div>

                ${jadwalViewMode === 'list' ? `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold uppercase text-slate-600">
                                        <th class="p-4">Jenjang / Kelas</th>
                                        <th class="p-4">Hari & Jam</th>
                                        <th class="p-4">Ruang Kelas</th>
                                        <th class="p-4">Tentor Pengajar</th>
                                        <th class="p-4">Slot Siswa (Max 6)</th>
                                        <th class="p-4">Nama Siswa Terdaftar</th>
                                        ${user.role === 'admin' ? '<th class="p-4 text-right">Aksi</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm text-slate-700">
                                    ${filtered.length === 0 ? `<tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada data jadwal kelas.</td></tr>` : 
                                      filtered.map(c => `
                                        <tr class="hover:bg-slate-50/50">
                                            <td class="p-4 font-bold text-slate-900"><span class="px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs mr-2">${c.jenjang}</span> ${c.kelas}</td>
                                            <td class="p-4"><p class="font-semibold">${c.hari}</p><p class="text-xs text-slate-500">${c.jam}</p></td>
                                            <td class="p-4"><span class="px-2.5 py-1 bg-purple-50 text-purple-600 rounded-lg text-xs font-bold">${c.ruang}</span></td>
                                            <td class="p-4 font-medium text-slate-800">${c.tentor}</td>
                                            <td class="p-4 font-semibold">${c.siswaList.length} / ${c.slotMax} Siswa</td>
                                            <td class="p-4"><div class="flex flex-wrap gap-1">${c.siswaList.map(s=>`<span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md text-xs">${s}</span>`).join('')}</div></td>
                                            ${user.role === 'admin' ? `
                                                <td class="p-4 text-right">
                                                    <button onclick="editClass(${c.id})" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg"><i class="fa-solid fa-pen"></i></button>
                                                    <button onclick="deleteClass(${c.id})" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                                                </td>
                                            ` : ''}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : `
                    <!-- Weekly Calendar View (Senin s/d Minggu) -->
                    <div class="grid grid-cols-1 md:grid-cols-7 gap-4">
                        ${['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'].map(hari => {
                            const dayClasses = classes.filter(c => c.hari === hari);
                            return `
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col">
                                    <div class="border-b border-slate-100 pb-3 mb-3 flex items-center justify-between">
                                        <h3 class="font-bold text-slate-800 text-sm">${hari}</h3>
                                        <span class="px-2 py-0.5 bg-blue-50 text-blue-600 rounded-md text-[10px] font-bold">${dayClasses.length} Sesi</span>
                                    </div>
                                    <div class="space-y-3 flex-1">
                                        ${dayClasses.length === 0 ? `<p class="text-xs text-slate-400 italic text-center py-6">Tidak ada jadwal</p>` :
                                          dayClasses.map(c => `
                                            <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl">
                                                <div class="flex justify-between items-start mb-1">
                                                    <span class="text-[10px] font-bold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded">${c.jenjang} - ${c.kelas}</span>
                                                    <span class="text-[10px] font-semibold text-purple-600">${c.ruang}</span>
                                                </div>
                                                <p class="text-xs font-bold text-slate-800">${c.jam}</p>
                                                <p class="text-[11px] text-slate-600 mt-1"><i class="fa-solid fa-chalkboard-user mr-1"></i>${c.tentor}</p>
                                                <p class="text-[10px] text-slate-400 mt-1">Siswa: ${c.siswaList.length}/${c.slotMax}</p>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        })}
                    </div>
                `}
            </div>

            <!-- Modal Add/Edit Class -->
            <div id="class-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="class-modal-title" class="font-bold text-lg text-slate-800">Tambah Kelas Bimbel</h3>
                        <button onclick="closeClassModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <form onsubmit="saveClassForm(event)" class="space-y-4">
                        <input type="hidden" id="class-id">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Jenjang</label>
                                <select id="class-jenjang" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <option value="SD">SD</option>
                                    <option value="SMP">SMP</option>
                                    <option value="SMA">SMA</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nama Kelas</label>
                                <input type="text" id="class-nama" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Contoh: 12 IPA">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Hari</label>
                                <select id="class-hari" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <option value="Senin">Senin</option>
                                    <option value="Selasa">Selasa</option>
                                    <option value="Rabu">Rabu</option>
                                    <option value="Kamis">Kamis</option>
                                    <option value="Jumat">Jumat</option>
                                    <option value="Sabtu">Sabtu</option>
                                    <option value="Minggu">Minggu</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Jam Les</label>
                                <input type="text" id="class-jam" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="15:30 - 17:00">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Ruang Kelas</label>
                                <select id="class-ruang" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    <option value="Ruang 1">Ruang 1</option>
                                    <option value="Ruang 2">Ruang 2</option>
                                    <option value="Ruang 3">Ruang 3</option>
                                    <option value="Ruang 4">Ruang 4</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Tentor Pengajar</label>
                                <select id="class-tentor" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                    ${tentors.map(t => `<option value="${t.name}">${t.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Slot Maksimal Siswa (Default 6)</label>
                            <input type="number" id="class-slot" value="6" min="1" max="15" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Pilih Siswa Aktif (Multi-select / Dropdown)</label>
                            <div class="max-h-36 overflow-y-auto border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-2">
                                ${students.filter(s=>s.status==='aktif').map(s => `
                                    <label class="flex items-center gap-2 text-sm">
                                        <input type="checkbox" name="class-siswa-chk" value="${s.name}" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                        <span>${s.name} (${s.kelas})</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>

            const slotMax = parseInt(document.getElementById('class-slot').value);
            const siswaList = [];
            document.querySelectorAll('input[name="class-siswa-chk"]:checked').forEach(chk => siswaList.push(chk.value));

            let classes = getDB('classes');
            if (id) {
                const idx = classes.findIndex(c => c.id == id);
                if (idx !== -1) {
                    classes[idx] = { id: parseInt(id), jenjang, kelas, hari, jam, ruang, tentor, slotMax, siswaList };
                }
            } else {
                classes.push({ id: Date.now(), jenjang, kelas, hari, jam, ruang, tentor, slotMax, siswaList });

            closeClassModal();
            showToast('Jadwal kelas berhasil disimpan!');
            renderApp();

            e.preventDefault();

            const username = document.getElementById('user-uname').value;
            const pass = document.getElementById('user-pass').value;
            const role = document.getElementById('user-role').value;

            let users = getDB('users');
            if (id) {
                const idx = users.findIndex(u => u.id == id);
                if (idx !== -1) users[idx] = { id: parseInt(id), name, username, pass, role };

                users.push({ id: Date.now(), name, username, pass, role });

            closeUserModal();
            showToast('Akun berhasil disimpan!');
            renderApp();

                                        <td class="p-4">${c.hari}, ${c.jam}</td>
                                        <td class="p-4">${c.ruang}</td>
                                        <td class="p-4 font-semibold">${c.siswaList.length} Siswa</td>
                                        <td class="p-4 font-extrabold text-emerald-600">Rp ${(c.siswaList.length * 45000).toLocaleString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        // Profile Modal
        function openProfileModal() {
            const user = getCurrentUser();
            const newName = prompt('Ubah Nama Lengkap:', user.name);
            if (newName) {
                user.name = newName;
                setCurrentUser(user);
                showToast('Profil berhasil diperbarui!');
            }
        }
